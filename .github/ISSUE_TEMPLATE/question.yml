name: Question or suggestion
description: Ask a question or suggest an improvement.
title: "[Question]: "
labels: [question]
body:
  - type: markdown
    attributes:
      value: |
        GitHub Issues are public. Use fictional examples and omit API keys, profile IDs, IP addresses and personal logs.
  - type: textarea
    id: question
    attributes:
      label: Question or suggestion
      description: Explain what you want to understand or improve and why.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: My message contains no keys or private information.
          required: true
