name: Vraag of suggestie
description: Stel een vraag of geef een verbetersuggestie.
title: "[Vraag]: "
labels: [question]
body:
  - type: markdown
    attributes:
      value: |
        GitHub Issues zijn openbaar. Gebruik fictieve voorbeelden en laat API-sleutels, profiel-ID's, IP-adressen en persoonlijke logs weg.
  - type: textarea
    id: question
    attributes:
      label: Vraag of suggestie
      description: Leg uit wat je wilt weten of verbeteren en waarom.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Controle
      options:
        - label: Mijn bericht bevat geen sleutels of privégegevens.
          required: true
