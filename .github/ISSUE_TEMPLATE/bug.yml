name: Bug report
description: Report a problem with NextDNS Assistant.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        This form creates a public GitHub Issue. Do not share API keys, profile IDs, IP addresses or personal DNS log exports.
  - type: textarea
    id: problem
    attributes:
      label: What went wrong?
      description: Describe the behavior and any error message, with private information removed.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can the problem be reproduced?
      description: Provide steps or an example prompt using fictional domains and data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Connection
        - Logs or analytics
        - Lists or settings
        - Applying changes
        - Interface
        - Other area
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I have removed keys, profile IDs and other private information from this report.
          required: true
